name: Playwright UI E2E Pipeline

on:
  push:
    branches: [ fix-clean-architecture ]
  pull_request:
    branches: [ fix-clean-architecture ]
  schedule:
    # 매일 한국 시간 자정(KST 00:00 -> UTC 15:00)에 회귀 테스트 자동 실행
    - cron: '0 15 * * *'
  # --- 추가된 부분: 수동 트리거 및 선택 옵션 ---
  workflow_dispatch:
    inputs:
      test_target:
        description: '실행할 테스트 모듈을 선택하세요 (전체, API, UI, 핵심기능)'
        required: true
        default: 'tests/'
        type: choice
        options:
          - 'tests/'
          - 'tests/api/'
          - 'tests/ui/'
          - '-m smoke'

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # requirements.txt 파일에 명시된 패키지(pandas, requests 등) 설치
        pip install -r requirements.txt
        pip install pytest pytest-playwright pytest-html

    - name: Install Playwright Browsers
      run: playwright install --with-deps
      # run: playwright install --with-deps chromium  ##크로미움만 필요할 경우 변경하여 사용##

    - name: Start local Flask server (mock backend)
      # 배포 전의 "새 코드"를 검증하기 위해 CI 러너 안에서 app.py를 직접 실행합니다.
      run: |
        nohup python app.py > flask.log 2>&1 &
        for i in $(seq 1 30); do
          if curl -sf http://localhost:5001/login > /dev/null; then
            echo "Flask 서버 준비 완료 (시도 ${i}회)"
            exit 0
          fi
          sleep 1
        done
        echo "::error::Flask 서버가 30초 안에 시작되지 않았습니다."
        cat flask.log
        exit 1

    - name: Run API & UI Tests
          # Python 코드(settings.py, conftest.py 등)에서 사용할 수 있도록 환경변수 주입
      env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          # --- 추가된 부분: 평문 하드코딩을 대체할 인증 정보 주입 ---
          NORMAL_USER_ID: ${{ secrets.NORMAL_USER_ID }}
          NORMAL_USER_PASSWORD: ${{ secrets.NORMAL_USER_PASSWORD }}
          # --- 추가된 부분: 러너에서 띄운 Flask 서버를 테스트 대상으로 지정 ---
          WEB_BASE_URL: http://localhost:5001
          API_BASE_URL: http://localhost:5001
      run: pytest ${{ github.event.inputs.test_target || 'tests/' }} -s -v --screenshot=only-on-failure --tracing=retain-on-failure --html=report.html --self-contained-html

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: automation-test-report
        path: |
          test-results/
          report.html
          flask.log
        retention-days: 7

    - name: Trigger Render Deployment
      if: success() && github.event_name != 'pull_request'
      env:
        RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      run: |
        if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
          echo "::error::RENDER_DEPLOY_HOOK_URL 시크릿이 설정되지 않았습니다."
          exit 1
        fi
        curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

    - name: Send Slack Notification
      if: always()
      uses: rtCamp/action-slack-notify@v2
      env:
            SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
            SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
            SLACK_TITLE: "QA 자동화 파이프라인 실행 결과: ${{ job.status }}"
            # --- 슬랙 메시지에도 어떤 타겟을 실행했는지 표시 ---
            SLACK_MESSAGE: "GitHub Actions Artifacts에서 report.html 리포트를 확인해주세요. (Target: ${{ github.event.inputs.test_target || '전체' }})"
            SLACK_USERNAME: "QA Automation Bot"
            SLACK_FOOTER: "Playwright UI E2E Pipeline Framework CI/CD"