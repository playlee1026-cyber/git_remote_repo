name: Playwright UI E2E Pipeline

on:
  push:
    branches: [ master ]

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    
    steps:
    # 1. GitHub 레포지토리의 소스 코드를 클라우드 러너로 체크아웃
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Python 환경 세팅 (버전 지정)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. 필수 라이브러리(pytest, playwright) 설치
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-playwright

    # 4. Playwright 브라우저 엔진 및 리눅스 시스템 의존성 설치
    - name: Install Playwright Browsers
      run: playwright install --with-deps

    - name: Wake up Render server
      run: curl -s https://git-remote-repo.onrender.com/login > /dev/null

    # 5. pytest를 이용해 UI 테스트 실행 (Headless 모드)
    - name: Run Pytest UI Tests
      run: pytest CI/CD_Line_test/test.py -v

    # 테스트가 성공(success)했을 때만 작동하는 배포 연동 단계
    - name: Trigger Render Deployment
      if: success()
      run: |
        curl -X POST "https://git-remote-repo.onrender.com"


        - name: Run Playwright tests
        # 1. 스크린샷 옵션 추가
        run: pytest CI/CD_Line_test/test.py -v --screenshot=only-on-failure

      - name: Upload test results
        # 2. 테스트가 실패해도 항상 실행되도록 설정
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          # playwright-pytest 기본 스크린샷 저장 경로
          path: test-results/ 
          retention-days: 7