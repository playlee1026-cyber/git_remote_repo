[pytest]
# 테스트 파일 탐색 규칙 명시적 정의 (기본 패턴 + E2E 패턴 추가)
python_files = test_*.py *_test.py e2etest_*.py

markers =
    api: 백엔드 API의 응답 및 비즈니스 로직을 검증하는 마커입니다.
    ui: UI (End-to-End) 테스트를 나타내는 마커입니다.
    security: 보안 및 권한 접근 관련 테스트를 나타내는 마커입니다.
    registration: 회원가입 및 계정 생성 플로우와 관련된 테스트를 나타내는 마커입니다.
    login: Tests related to user login and logout flow
    products: 상품 탐색 및 장바구니 관련 테스트 마커
    checkout: 장바구니 확인부터 배송지 확인, 결제 및 주문 완료까지의 체크아웃 전체 플로우를 검증하는 마커입니다.