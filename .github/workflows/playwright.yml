name: Playwright UI E2E Pipeline

on:
  push:
    branches: [ master ]

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-playwright pytest-html

    - name: Install Playwright Browsers
      run: playwright install --with-deps

    - name: Wake up Render server
      run: curl -s https://git-remote-repo.onrender.com/login > /dev/null

    - name: Run Playwright tests
      # 시각적 리포트 생성(--html) 및 에러 발생 시 네트워크/DOM 트레이스 저장(--tracing) 옵션 추가
      run: pytest CI/CD_Line_test/test.py "API 테스트 코드/" -v --screenshot=only-on-failure --tracing=retain-on-failure --html=report.html --self-contained-html

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-test-results
        path: |
          test-results/
          report.html
        retention-days: 7

    - name: Trigger Render Deployment
      if: success()
      run: |
        curl -X POST "https://git-remote-repo.onrender.com"