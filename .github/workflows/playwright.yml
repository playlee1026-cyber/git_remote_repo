name: Playwright UI E2E Pipeline

on:
  push:
    branches: [ master ]

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # requirements.txt 파일에 명시된 패키지(pandas, requests 등) 설치
        pip install -r requirements.txt
        pip install pytest pytest-playwright pytest-html

    - name: Install Playwright Browsers
      run: playwright install --with-deps

    - name: Wake up Render server
      run: curl -s https://git-remote-repo.onrender.com/login > /dev/null

    - name: Run Playwright tests
      # 시각적 리포트 생성(--html) 및 에러 발생 시 네트워크/DOM 트레이스 저장(--tracing) 옵션 추가
      run: pytest CI/CD_Line_test/test.py API/ -v --screenshot=only-on-failure --tracing=retain-on-failure --html=report.html --self-contained-html

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-test-results
        path: |
          test-results/
          report.html
        retention-days: 7

    - name: Trigger Render Deployment
      if: success()
      run: |
        curl -X POST "https://git-remote-repo.onrender.com"

    - name: Send Slack Notification
      if: always()
      uses: rtCamp/action-slack-notify@v2
      env:
            # 깃허브에 숨겨둔 URL(Secret)을 안전하게 호출하여 사용합니다.
            SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
            SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
            SLACK_TITLE: "QA 자동화 파이프라인 실행 결과: ${{ job.status }}"
            SLACK_MESSAGE: "GitHub Actions Artifacts에서 report.html 리포트를 확인해주세요."
            SLACK_USERNAME: "QA Automation Bot"
            SLACK_FOOTER: "Git-Remote-Repo CI/CD"